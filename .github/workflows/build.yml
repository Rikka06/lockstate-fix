name: Build & Release Package

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Zip Package
        run: |
          mkdir -p dist
          zip -r dist/LockstateFix-latest.zip META-INF action.sh customize.sh module.prop service.sh system.prop
          cd dist
          sha256sum LockstateFix-latest.zip > LockstateFix-latest.zip.sha256
          echo "SHA256: $(cat LockstateFix-latest.zip.sha256)"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LockstateFix-Package
          path: dist/*
